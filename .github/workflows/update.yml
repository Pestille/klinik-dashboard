name: Atualizar Dashboard

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia Ã s 06:00 horÃ¡rio de BrasÃ­lia (09:00 UTC)
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependÃªncias
        run: pip install requests

      - name: Gerar dashboard
        env:
          CLINICORP_TOKEN: ${{ secrets.CLINICORP_TOKEN }}
        run: python generate_dashboard.py

      - name: Buscar pagamentos dentistas
        env:
          CLINICORP_TOKEN: ${{ secrets.CLINICORP_TOKEN }}
        run: python fetch_dentist_payments.py

      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dentist_payments.json
          git diff --cached --quiet || git commit -m "Dashboard + pagamentos dentistas $(date -u '+%d/%m/%Y %H:%M') UTC"
          git push
